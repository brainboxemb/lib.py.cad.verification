[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainboxemb-cad-verification-lib"
version = "0.16.0"
description = "Reusable Python library for CAD/model verification"
dependencies = ["trimesh>=4,<5", "scipy>=1.12,<2", "Pillow>=11,<13"]
requires-python = ">=3.11"

[tool.setuptools]
packages = ["cad_verification", "cad_verification.adapters"]
